# tmux config. Linked to ~/.config/tmux/tmux.conf by ~/dotfiles/install.sh.
# Prefix is Ctrl-a.  Reload after editing: prefix + R.
# Plugins: prefix + I installs new ones, prefix + U updates them.

# ── Terminal & colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle" # true color + curly underlines (Neovim errors)
set -as terminal-features ",alacritty*:RGB:usstyle"
set -g focus-events on # tell Neovim when you switch back to it (it then re-checks files)
set -s escape-time 0   # Esc reaches Neovim immediately

# ── Prefix: Ctrl-a ────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix # Ctrl-a twice sends Ctrl-a to the program (e.g. start of line in bash)

# ── General ───────────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000 # lines of scrollback per pane
set -g base-index 1        # windows and panes are numbered from 1
setw -g pane-base-index 1
set -g renumber-windows on # no gaps after closing a window
set -g display-time 4000   # show messages for 4 s
set -g status-interval 5   # refresh the status bar every 5 s
set -g status-keys emacs   # emacs keys in the command prompt (prefix + :)
setw -g aggressive-resize on
set -g set-clipboard on    # copying in tmux also reaches the system clipboard

# ── Copy mode (prefix + [): vi keys ───────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection    # v starts a selection, like in Vim
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle # Ctrl-v: block selection
unbind -T copy-mode-vi Space
# y copies the selection (tmux-yank), V selects whole lines, Escape / q leaves copy mode.

# ── Windows & panes ───────────────────────────────────────────────────────────
# New windows and splits open in the current folder
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind C-p previous-window
bind C-n next-window
bind -n C-S-Left swap-window -t -1\; select-window -t -1 # move the window left/right
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# prefix + Ctrl-arrows resizes the pane (hold Ctrl and keep pressing arrows)
bind -r C-Up resize-pane -U
bind -r C-Down resize-pane -D
bind -r C-Left resize-pane -L
bind -r C-Right resize-pane -R

# prefix + q shows each pane's number: press one to jump there. prefix + Q: press one to swap the
# current pane with it (your pane moves there and stays active). While the numbers are shown, each
# pane is also labelled like `tmux list-panes`: index, %id, program. Any other key (Esc) just closes.
set -g pane-border-format " #{pane_index}: #{pane_id} #{pane_current_command}#{?pane_active, (active),} "
bind q set -w pane-border-status top \; display-panes -d 0 \; set -wu pane-border-status
bind Q set -w pane-border-status top \; display-panes -d 0 "swap-pane -s %%" \; set -wu pane-border-status

# Move panes between windows: pick a window from the list
bind j choose-window -F "#{window_index}: #{window_name}" "join-pane -h -s %%" # bring its pane here (side by side)
bind J choose-window -F "#{window_index}: #{window_name}" "join-pane -v -s %%" # bring its pane here (above/below)
bind k choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%" # send this pane there (side by side)
bind K choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%" # send this pane there (above/below)

bind m set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
bind g display-popup -d "#{pane_current_path}" -w 50% -h 50% -E "bash" # floating shell
bind C-l send-keys C-l # clear the screen (Ctrl-l alone moves to the pane on the right)
bind R source-file ~/.config/tmux/tmux.conf\; display-message "configuration reloaded"

# Idea: jump straight to a window with Ctrl-1 ... Ctrl-9 (needs a terminal that sends those keys)
# bind -n C-1 select-window -t 1

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-bg green
set -g status-fg black
set -g status-left ""
set -g status-right " #{user} | %F %H:%M | #{session_name} "
set -g status-right-style bg=brightblack,fg=white
set -g window-status-format " #{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format " #{window_index}:#{window_name}#{window_flags} "
set -g window-status-style bg=default,fg=default
set -g window-status-current-style bg=brightblack,fg=white

# ── Plugins (tpm) ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'          # y in copy mode copies to the system clipboard
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl-h/j/k/l between tmux panes and Neovim splits
set -g @plugin 'tmux-plugins/tmux-resurrect'     # save/restore sessions: prefix + Ctrl-s / prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-continuum'     # ...automatically: saves every 15 min, restores on start
set -g @plugin 'Morantron/tmux-fingers'          # prefix + f: copy things on screen by typing a hint

# Restore the last saved sessions when tmux starts. Set to 'off' to start empty instead.
# (Neovim comes back as a plain `nvim`; <Leader>S. reopens that folder's session.)
set -g @continuum-restore 'on'

# tmux-fingers (options: https://github.com/Morantron/tmux-fingers#configuration)
set -g @fingers-key "f" # prefix + f (replaces tmux's "find window")
bind C-f run-shell -b "~/.config/tmux/plugins/tmux-fingers/bin/tmux-fingers start #{pane_id}" # prefix + Ctrl-f too
set -g @fingers-jump-key "C-j" # jump mode; its default (J) would replace your prefix + J above
# While fingers is active the pane is shown without its usual colors (that's how fingers works).
# The rest of the screen is dimmed, matches are yellow, and each hint is a yellow box drawn over
# the first letter(s) of its match: type those letters to copy it. What's copied is the real text.
set -g @fingers-backdrop-style "dim"
set -g @fingers-highlight-style "fg=yellow"
set -g @fingers-hint-style "fg=black,bg=yellow,bold"
# What gets a hint. Left out: digit (every number with 4+ digits) and kubernetes, which add
# lots of hints you rarely want and make them two letters long.
set -g @fingers-enabled-builtin-patterns "ip,uuid,sha,url,path,hex,git-status,git-status-branch,diff"
# Typing a hint runs fingers-copy.sh, which copies it to the system clipboard
set -g @fingers-main-action "$HOME/.config/tmux/fingers-copy.sh"

run '~/.config/tmux/plugins/tpm/tpm'
