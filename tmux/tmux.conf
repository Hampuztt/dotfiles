set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
set -a terminal-features 'xterm-256color:RGB'


#set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[5 q'
#set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q' # this is for the cursor shape
set -g mode-keys vi


# - WARNING True color support could not be detected. |'termguicolors'| won't work properly.
#   - ADVICE:
#     - Add the following to your tmux configuration file, replacing XXX by the value of $TERM outside of tmux:
#       set-option -a terminal-features 'XXX:RGB'
#     - For older tmux versions use this instead:
#       set-option -a terminal-overrides 'XXX:Tc'

# Set prefix to Ctrl-Space instead of Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

bind -n M-H previous-window
bind -n M-l next-window

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Morantron/tmux-fingers'
# restore nvim sessions (somehow)
set -g @resurrect-strategy-nvim 'session'
# use Ctrl-f to trigger fingers

## -- fingers
set -g @fingers-key "C-f"
# make hints stand out
set -g @fingers-hint-style "fg=black,bg=yellow,bold"
set -g @fingers-hint-format "%%s"   # just show the hint letters

# dim everything else while active
set -g @fingers-highlight-style "fg=white,bg=blue,bold"
# # optional: restrict to URLs and paths
# set -g @fingers-words "https?://\\S+ /[A-Za-z0-9._-]+"


#
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# keybindings to move windows
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

### SENSIBLE_OPTIONS
set -s escape-time 0
set -g history-limit 5000


# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# appearance
set -g status-bg green
set -g status-fg black
set -g status-left ""
set -g status-right " #(whoami) | %F %H:%M | #{session_name} "
set -g window-status-format " #{window_index}:#{window_name}#{window_flags} "
set -g window-status-current-format " #{window_index}:#{window_name}#{window_flags} "
set -g status-right-style bg=brightblack,fg=white
set -g window-status-style bg=default,fg=default
set -g window-status-current-style bg=brightblack,fg=white

# Emacs key bindings in tmux command prompt (prefix + :) 
set -g status-keys emacs

# Reload this config (prefix + R)
bind R source-file ~/.config/tmux/tmux.conf \; display-message "configuration reloaded"

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

### OTHER STUFF
set -g mouse on
# renumber windows automatically
set -g renumber-windows on
# indices start at 1
set -g base-index 1
setw -g pane-base-index 1

#copy
set-option -g set-clipboard on
unbind -T copy-mode-vi Space
# bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear "xclip -sel clip -i"
# bind -T copy-mode-vi y send-keys -X copy-pipe "xclip -i -selection clipboard > /dev/null 2>&1"

# I just added these from the tmux-yank docs
# set -g @custom_copy_command "xclip -i -selection clipboard > /dev/null 2>&1"
# set -g @override_copy_command "xclip -i -selection clipboard > /dev/null 2>&1"


bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

### NICE BINDINGS!
# move pane to a different window. you can choose window from a list
bind j choose-window -F "#{window_index}: #{window_name}" "join-pane -h -s %%"
bind J choose-window -F "#{window_index}: #{window_name}" "join-pane -v -s %%"


bind k choose-window -F "#{window_index}: #{window_name}" "join-pane -h -t %%"
bind K choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"
# bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
# bind-key k command-prompt -p "send pane to:"  "join-pane -t '%%'"
# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# bind -n S-Up move-pane -h -t '.{up-of}'
# bind -n S-Right move-pane -t '.{right-of}'
# bind -n S-Left move-pane -t '.{left-of}'
# bind -n S-down move-pane -h -t '.{down-of}'

bind-key m set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
# bind m if -F "#{window_synchronize_panes}" \
#     "setw synchronize-panes off; display-message 'Sync Off'" \
#     "setw synchronize-panes on; display-message 'Sync On'"


# bind g display-popup -E "bash"
# bind g display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 50% \
  -h 50% \
  -E "bash"

# bind -n C-1 select-window -t 1
# bind -n C-2 select-window -t 2
# bind -n C-3 select-window -t 3
# bind -n C-4 select-window -t 4
# bind -n C-5 select-window -t 5
# bind -n C-6 select-window -t 6
# bind -n C-7 select-window -t 7
# bind -n C-8 select-window -t 8
# bind -n C-9 select-window -t 9

run '~/.config/tmux/plugins/tpm/tpm'
