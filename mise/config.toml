# Tools that mise installs into your home folder (no sudo). Linked to ~/.config/mise/config.toml.
#
#   mise install                  install everything listed here (install.sh does this)
#   mise upgrade                  update the tools set to "latest" (and node within 24.x)
#   mise upgrade --bump neovim    update Neovim and write the new version into this file
#   mise ls                       what's installed
#
# "latest" = the newest version when first installed; it only changes when you run `mise upgrade`.
# Add a tool: find its name with `mise registry <name>`, then add a line below.

[tools]
neovim = "0.12.6" # pinned: the Neovim config is tested with this version, update it on purpose
node = "24" # any Node 24.x (the LTS line). Mason installs many language servers with npm
uv = "latest" # Python package/project manager

# Search and files
ripgrep = "latest"
fd = "latest"
fzf = "latest"

# Terminal UIs
lazygit = "latest"
lazydocker = "latest"
bottom = "latest" # `btm`, system monitor
gdu = "latest" # disk usage

# Alacritty has no ready-made Linux build, so mise compiles it with Rust (takes a few minutes).
rust = "latest"
"cargo:alacritty" = "latest"
